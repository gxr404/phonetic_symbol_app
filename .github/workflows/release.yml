
name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.6)"
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Set release tag
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "RELEASE_TAG=${{ inputs.tag }}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          fi
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Mise
        uses: jdx/mise-action@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      # - name: Restore Gradle Cache
      #   id: cache-gradle-restore
      #   uses: actions/cache/restore@v6
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       android/.gradle
      #     key: build-mobile-gradle-${{ runner.os }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Check build environment
        run: |
          echo "pubspec version:"
          grep '^version:' pubspec.yaml
          echo "FLUTTER_BUILD_NUMBER=$FLUTTER_BUILD_NUMBER"
          echo "FLUTTER_BUILD_NAME=$FLUTTER_BUILD_NAME"

      - name: Build Android App
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64,android-x64
      - name: Rename Android APKs
        run: |
          VERSION=$(sed -n 's/^version: //p' pubspec.yaml)

          if [[ "$VERSION" == *"+"* ]]; then
            BUILD_NUMBER="${VERSION#*+}"
          else
            BUILD_NUMBER="unknown"
          fi

          TAG="$RELEASE_TAG"

          mkdir -p build/release

          mv build/app/outputs/flutter-apk/app-release.apk \
            "build/release/app-${TAG}-${BUILD_NUMBER}-release.apk"

          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
            "build/release/app-${TAG}-${BUILD_NUMBER}-armeabi-v7a-release.apk"

          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            "build/release/app-${TAG}-${BUILD_NUMBER}-arm64-v8a-release.apk"

          mv build/app/outputs/flutter-apk/app-x86_64-release.apk \
            "build/release/app-${TAG}-${BUILD_NUMBER}-x86_64-release.apk"

          ls -lh build/release
      - name: Find versionCode overrides
        run: |
          echo "=== Search 2001 ==="
          grep -R "2001" . \
            --exclude-dir=.git \
            --exclude-dir=.dart_tool \
            --exclude-dir=build \
            || true
          echo "=== Search versionCode ==="
          grep -R "versionCode" android \
            --exclude-dir=.gradle \
            || true
      - name: Publish Android Artifact
        uses: actions/upload-artifact@v7
        with:
          name: android-apk-${{ env.RELEASE_TAG }}
          path: build/release/*.apk

      # - name: Save Gradle Cache
      #   id: cache-gradle-save
      #   uses: actions/cache/save@v6
      #   with:
      #     path: |
      #       ~/.gradle/caches
      #       ~/.gradle/wrapper
      #       android/.gradle
      #     key: ${{ steps.cache-gradle-restore.outputs.cache-primary-key }}

      - name: Create Release
        uses: softprops/action-gh-release@v3
        # if: github.ref_type == 'tag'
        with:
          draft: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            build/release/*.apk